<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="./img/VectorPizza.svg" alt="pizza" />
        <img src="./img/Pizza&Front.svg" alt="pizza&Front" />
      </div>
      <nav>
        <ul>
          <li>Home</li>
          <li>Ranking</li>
          <li>Promoción</li>
          <li>Contacto</li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="delivery">
        <img src="./img/delivery.png" alt="delivery pizza" />
        <h2>Envío gratis <span>comprando </span> 2 pizzas</h2>
      </div>
      <div class="lado-derecho">
        <div class="podio-pizza">
          <h2>Podio de pizzas</h2>
        </div>
        <div class="menu">
          <div class="lista">
            <p>Pizzas Top 5</p>
            <ol>
              <li>Muzarella</li>
              <li>Hawaiana</li>
              <li>Muzzarella J&Morrón</li>
              <li>Fugazzeta</li>
              <li>Calabresa</li>
            </ol>
          </div>
          <div class="ingredientes">
            <img src="./img/falling.png" alt="imagen ingredientes cayendo" />
          </div>
        </div>
      </div>
    </main>
    <footer>
      <nav>
        <ul>
          <li>Home</li>
          <li>Ranking</li>
          <li>Promoción</li>
          <li>Contacto</li>
        </ul>
      </nav>
      <div class="logo">
        <img src="./img/VectorPizza.svg" alt="pizza" />
        <img src="./img/Pizza&Front.svg" alt="pizza&Front" />
      </div>
    </footer>
  </body>
</html>
